# Sample pregen for testing supervillain; check against Draw Steel: Heroes before real play.
# The numbers are plausible for level 1, not copied from the book. Abilities are short sample
# paraphrases with numbers, not rules text.
name: Kesh
class: Fury
level: 1
characteristics: { might: 2, agility: 2, reason: 0, intuition: 1, presence: 0 }
stamina: 24
recoveries: 10
speed: 6
stability: 1
resource: { name: ferocity, perTurn: 1d3 }
victories: 0
abilities:
  - name: Melee Free Strike
    kind: free strike
    characteristics: [might, agility]
    keywords: Melee, Strike, Weapon
    distance: Melee 1
    target: One creature or object
    tier1: 2 + M damage
    tier2: 5 + M damage
    tier3: 7 + M damage
  - name: Reckless Swing
    kind: main action
    characteristics: might
    keywords: Melee, Strike, Weapon
    distance: Melee 1
    target: One creature
    tier1: 3 + M damage
    tier2: 6 + M damage
    tier3: 9 + M damage
    effect: Until the start of Kesh's next turn, strikes against Kesh have an edge.
  - name: Bounding Leap
    kind: maneuver
    characteristics: agility
    cost: 3
    distance: Self
    target: Self
    effect: Kesh jumps up to 4 squares, then makes a free strike against one adjacent creature.
