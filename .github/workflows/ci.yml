name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "26"
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'patches/**') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check format, lint, comments, and types
        run: bun run check
      - name: Run tests
        run: bun test --parallel
      - name: Build site
        run: bun --filter @supervillain/site build
      - name: Build standalone binary
        run: bun run release:build
      - name: Install tmux for terminal smoke test
        run: command -v tmux >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends tmux)
      - name: Smoke test compiled binary
        run: bun run release:smoke dist/supervillain-linux-x64
        env:
          SMOKE_REQUIRE_TTY: "1"
