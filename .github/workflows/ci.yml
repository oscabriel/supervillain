name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux
      - run: bun run check
      - run: bun test
      - run: bun --filter @supervillain/site build
      - run: bun run release:build
      - run: bun run release:smoke dist/supervillain-linux-x64
        env:
          SMOKE_REQUIRE_TTY: "1"
