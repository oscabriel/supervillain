name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run check
      - run: bun run depcruise
      - run: bun run test:conformance
      - run: bun run test:draw-steel
      - run: bun run test:identity
      - run: bun run test:session
      - run: bun run test:table
      - run: bun run test:cli
      - run: bun run test:gateway
      - run: bun run test:install

  # The dual Bun/Node lane is the standing claim that the event-sourced core stays
  # runtime-portable: only the edges (Table, gateway render, CLI binary) are
  # Bun-bound, so room-host, room-wire and transport-ws run identical specs under
  # both runners (ADR-0012, NQ-12). Nothing here touches an external network any
  # more — the remaining reason this is not a per-PR job is the macOS runner's
  # cost, so it stays main-push-and-dispatch until that runner earns its place on
  # every PR or leaves the matrix.
  dual-lane:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Run live direct-door CLI test
        if: runner.os == 'Linux'
        run: bun run test:cli-live
      - name: Run dual-lane suites with one retry
        run: |
          bun run test:room-host && bun run test:transport-ws && bun run test:room-wire || {
            echo "::warning::dual-lane suites failed once; retrying"
            bun run test:room-host && bun run test:transport-ws && bun run test:room-wire
          }
