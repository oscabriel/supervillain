name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "26"
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.bun/install/cache
          key: bun-all-${{ runner.os }}-${{ hashFiles('bun.lock', 'patches/**') }}
          restore-keys: |
            bun-all-${{ runner.os }}-
            bun-${{ runner.os }}-
      - name: Install dependencies for all targets
        run: bun install --frozen-lockfile --os="*" --cpu="*"
      - name: Check format, lint, comments, and types
        run: bun run check
      - name: Run tests
        run: bun test --parallel
      - name: Build all release binaries
        run: bun scripts/build.ts --all --version "$GITHUB_REF_NAME"
      - name: Upload supervillain-linux-x64
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          path: dist/supervillain-linux-x64
          archive: false
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Upload supervillain-linux-arm64
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          path: dist/supervillain-linux-arm64
          archive: false
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Upload supervillain-darwin-arm64
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          path: dist/supervillain-darwin-arm64
          archive: false
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Upload supervillain-darwin-x64
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          path: dist/supervillain-darwin-x64
          archive: false
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  smoke:
    needs: build
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            binary: supervillain-linux-x64
          - runner: ubuntu-24.04-arm
            binary: supervillain-linux-arm64
          - runner: macos-latest
            binary: supervillain-darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout smoke script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: scripts
      - name: Download binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ matrix.binary }}
          path: dist
      - name: Install tmux (Linux)
        if: runner.os == 'Linux'
        run: command -v tmux >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends tmux)
      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: command -v tmux >/dev/null || brew install tmux
      - name: Run smoke test
        run: bash scripts/smoke.sh "dist/${{ matrix.binary }}"
        env:
          SMOKE_REQUIRE_TTY: "1"

  release:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: supervillain-*
          path: dist
          merge-multiple: true
      - name: Verify binaries and generate checksums
        working-directory: dist
        run: |
          bins=(
            supervillain-linux-x64
            supervillain-linux-arm64
            supervillain-darwin-arm64
            supervillain-darwin-x64
          )
          for bin in "${bins[@]}"; do
            test -f "$bin"
          done
          chmod +x "${bins[@]}"
          sha256sum "${bins[@]}" > SHA256SUMS
          cat SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            dist/supervillain-linux-x64
            dist/supervillain-linux-arm64
            dist/supervillain-darwin-arm64
            dist/supervillain-darwin-x64
            dist/SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          assets=(
            dist/supervillain-linux-x64
            dist/supervillain-linux-arm64
            dist/supervillain-darwin-arm64
            dist/supervillain-darwin-x64
            dist/SHA256SUMS
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            args=(--verify-tag --title "supervillain $TAG" --generate-notes)
            case "$TAG" in *-*) args+=(--prerelease) ;; esac
            gh release create "$TAG" "${assets[@]}" "${args[@]}"
          fi

  deploy-relay:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    permissions:
      contents: read
      attestations: read
    uses: ./.github/workflows/relay-deploy.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
