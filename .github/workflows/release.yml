name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.triple }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: linux-x64
            runner: ubuntu-latest
          - triple: linux-arm64
            runner: ubuntu-24.04-arm
          - triple: macos-arm64
            runner: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run compile:${{ matrix.triple }}
      - name: Ad-hoc codesign macOS binary
        if: runner.os == 'macOS'
        run: |
          codesign --force --sign - dist-bin/supervillain
          codesign --verify --strict dist-bin/supervillain
      - name: Smoke runtime-free binary outside checkout
        run: sh smoke/release-smoke.sh "$PWD/dist-bin/supervillain"
      - name: Run live direct-door pair against compiled binary
        if: runner.os == 'Linux'
        run: SUPERVILLAIN_CLI="$PWD/dist-bin/supervillain" bun run test:cli-live
      - name: Package binary
        run: tar -czf supervillain-${{ matrix.triple }}.tar.gz -C dist-bin supervillain
      - uses: actions/upload-artifact@v4
        with:
          name: supervillain-${{ matrix.triple }}
          path: supervillain-${{ matrix.triple }}.tar.gz

  release:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: sha256sum *.tar.gz > SHA256SUMS
      - run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes supervillain-*.tar.gz SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
