name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-all-${{ runner.os }}-${{ hashFiles('bun.lock', 'patches/**') }}
          restore-keys: |
            bun-all-${{ runner.os }}-
            bun-${{ runner.os }}-
      - name: Install dependencies for all targets
        run: bun install --frozen-lockfile --os="*" --cpu="*"
      - name: Check format, lint, comments, and types
        run: bun run check
      - name: Run tests
        run: bun test --parallel
      - name: Build all release binaries
        run: bun scripts/build.ts --all --version "$GITHUB_REF_NAME"
      - name: Upload supervillain-linux-x64
        uses: actions/upload-artifact@v7
        with:
          path: dist/supervillain-linux-x64
          archive: false
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Upload supervillain-linux-arm64
        uses: actions/upload-artifact@v7
        with:
          path: dist/supervillain-linux-arm64
          archive: false
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Upload supervillain-darwin-arm64
        uses: actions/upload-artifact@v7
        with:
          path: dist/supervillain-darwin-arm64
          archive: false
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Upload supervillain-darwin-x64
        uses: actions/upload-artifact@v7
        with:
          path: dist/supervillain-darwin-x64
          archive: false
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  smoke:
    needs: build
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            binary: supervillain-linux-x64
          - runner: macos-latest
            binary: supervillain-darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout smoke script
        uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.binary }}
          path: dist
      - name: Install tmux (Linux)
        if: runner.os == 'Linux'
        run: command -v tmux >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends tmux)
      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: command -v tmux >/dev/null || brew install tmux
      - name: Run smoke test
        run: bash scripts/smoke.sh "dist/${{ matrix.binary }}"
        env:
          SMOKE_REQUIRE_TTY: "1"

  release:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v8
        with:
          pattern: supervillain-*
          path: dist
          merge-multiple: true
      - name: Verify binaries and generate checksums
        working-directory: dist
        run: |
          bins=(
            supervillain-linux-x64
            supervillain-linux-arm64
            supervillain-darwin-arm64
            supervillain-darwin-x64
          )
          for bin in "${bins[@]}"; do
            test -f "$bin"
          done
          chmod +x "${bins[@]}"
          sha256sum "${bins[@]}" > SHA256SUMS
          cat SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          args=(--verify-tag --title "supervillain $TAG" --generate-notes)
          case "$TAG" in *-*) args+=(--prerelease) ;; esac
          gh release create "$TAG" \
            dist/supervillain-linux-x64 \
            dist/supervillain-linux-arm64 \
            dist/supervillain-darwin-arm64 \
            dist/supervillain-darwin-x64 \
            dist/SHA256SUMS \
            "${args[@]}"
