name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --os="*" --cpu="*"
      - run: bun run check
      - run: bun test
      - run: bun scripts/build.ts --all --version "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/supervillain-*
          if-no-files-found: error
          retention-days: 7

  smoke:
    needs: build
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-latest
            binary: supervillain-linux-x64
          - runner: macos-latest
            binary: supervillain-darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist
      - name: Install tmux for the terminal seat (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux
      - name: Install tmux for the terminal seat (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux
      - run: bash scripts/smoke.sh "dist/${{ matrix.binary }}"
        env:
          SMOKE_REQUIRE_TTY: "1"

  release:
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist
      - name: Checksums
        working-directory: dist
        run: |
          chmod +x supervillain-*
          sha256sum supervillain-* > SHA256SUMS
          cat SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" dist/supervillain-* dist/SHA256SUMS \
            --verify-tag --title "supervillain $TAG" --generate-notes $prerelease
