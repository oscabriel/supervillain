name: Deploy production

on:
  push:
    tags: ["deploy-*"]
  workflow_dispatch:
    inputs:
      deployable:
        description: Component to deploy from the selected ref
        required: true
        default: all
        type: choice
        options:
          - all
          - gateway
          - web

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      TARGET: ${{ github.event.inputs.deployable || 'all' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Static/config gates run before any SSH material is written to disk.
      - run: bun install --frozen-lockfile
      - name: Install the pinned deployment runner
        run: python -m pip install --disable-pip-version-check ansible-core==2.21.2
      - run: bun run build
      - run: bun run check
      - run: sh infra/scripts/validate-local

      - name: Build and smoke the gateway artifact
        if: env.TARGET == 'all' || env.TARGET == 'gateway'
        run: |
          bun run compile:linux-x64
          sh smoke/gateway-smoke.sh "$PWD/dist-bin/supervillain"
          archive_epoch=$(git show -s --format=%ct HEAD)
          tar --sort=name --mtime="@$archive_epoch" --owner=0 --group=0 \
            --numeric-owner -czf /tmp/sv-gateway.tar.gz -C dist-bin supervillain

      - name: Build and smoke the web production output
        if: env.TARGET == 'all' || env.TARGET == 'web'
        run: |
          bun run test:web
          bun --cwd apps/web run build
          archive_epoch=$(git show -s --format=%ct HEAD)
          tar --sort=name --mtime="@$archive_epoch" --owner=0 --group=0 \
            --numeric-owner -czf /tmp/sv-web.tar.gz -C apps/web .output

      - name: Configure the pinned deploy SSH identity
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          # DEPLOY_HOST is this step's secret environment variable.
          # shellcheck disable=SC2153
          deploy_host=$DEPLOY_HOST
          DEPLOY_PORT=$(awk '$1 == "sv_admin_ssh_port:" { print $2 }' \
            infra/inventory/group_vars/all.yml)
          case "$DEPLOY_PORT" in (*[!0-9]*|'') exit 1 ;; esac
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 0600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"
          cat > /tmp/supervillain-inventory.yml <<EOF
          all:
            children:
              apex:
                hosts:
                  production:
                    ansible_host: $deploy_host
                    ansible_port: $DEPLOY_PORT
                    ansible_user: deploy
                    ansible_ssh_private_key_file: $HOME/.ssh/id_ed25519
          EOF

      - name: Deploy through the shared gateway/web release playbook
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/infra/ansible.cfg
        run: |
          set -eu
          if [ "$TARGET" = all ] || [ "$TARGET" = gateway ]; then
            ansible-playbook -i /tmp/supervillain-inventory.yml \
              infra/playbooks/deploy.yml \
              -e sv_deployable=gateway \
              -e sv_release_sha="$GITHUB_SHA" \
              -e sv_artifact_path=/tmp/sv-gateway.tar.gz
          fi
          if [ "$TARGET" = all ] || [ "$TARGET" = web ]; then
            ansible-playbook -i /tmp/supervillain-inventory.yml \
              infra/playbooks/deploy.yml \
              -e sv_deployable=web \
              -e sv_release_sha="$GITHUB_SHA" \
              -e sv_artifact_path=/tmp/sv-web.tar.gz
          fi
