name: Deploy Site

on:
  push:
    branches:
      - main
    paths:
      - "packages/site/**"
      - "packages/domain/**"
      - "scripts/install.sh"
      - ".github/workflows/site-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check Cloudflare deploy credentials
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID repository secrets." >&2
            exit 1
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Skipping site deploy: CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID secret not configured."
          fi
      - name: Checkout
        if: steps.creds.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node
        if: steps.creds.outputs.ready == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "26"
      - name: Setup Bun
        if: steps.creds.outputs.ready == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - name: Cache Bun packages
        if: steps.creds.outputs.ready == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'patches/**') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - name: Install dependencies
        if: steps.creds.outputs.ready == 'true'
        run: bun install --frozen-lockfile
      - name: Check format, lint, comments, and types
        if: steps.creds.outputs.ready == 'true'
        run: bun run check
      - name: Run site tests
        if: steps.creds.outputs.ready == 'true'
        run: bun test packages/site
      - name: Build and deploy site
        if: steps.creds.outputs.ready == 'true'
        working-directory: packages/site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPERVILLAIN_SITE_DOMAIN: ${{ vars.SUPERVILLAIN_SITE_DOMAIN }}
          SUPERVILLAIN_RELAY_HOST_KEY: ${{ vars.SUPERVILLAIN_RELAY_HOST_KEY }}
        run: bun run build && bun run deploy:ci
