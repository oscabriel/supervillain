# Litestream 0.5.15. One watched root covers both operated SQLite stores:
# gateway/registry.db and web/store.db. New *.db files are picked up without a
# daemon restart; non-database files in the durable tree are ignored.
logging:
  level: info
  type: json
  stderr: true
retention:
  # Let object-storage lifecycle policy own deletion. Replication credentials
  # do not need DeleteObject, reducing the blast radius of a leaked credential.
  enabled: false
sync-interval: 1s
shutdown-sync-timeout: 30s
shutdown-sync-interval: 500ms
verify-compaction: true
endpoint: ${LITESTREAM_ENDPOINT}
region: ${LITESTREAM_REGION}
force-path-style: ${LITESTREAM_FORCE_PATH_STYLE}
heartbeat-url: ${LITESTREAM_HEARTBEAT_URL}
heartbeat-interval: 5m

dbs:
  - dir: /var/lib/supervillain
    pattern: "*.db"
    recursive: true
    watch: true
    meta-dir: /var/lib/supervillain/litestream
    replica:
      url: ${LITESTREAM_REPLICA_URL}/sqlite
