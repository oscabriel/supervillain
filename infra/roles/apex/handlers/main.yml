---
- name: Restart administrative SSH
  ansible.builtin.systemd_service:
    name: ssh.service
    state: restarted
  listen: restart administrative ssh

- name: Restart Caddy
  ansible.builtin.systemd_service:
    name: caddy
    state: restarted
  listen: restart caddy

- name: Restart Litestream
  ansible.builtin.systemd_service:
    name: sv-litestream.service
    state: restarted
  listen: restart litestream
